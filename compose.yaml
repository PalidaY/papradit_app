name: papradit
services:
  db:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papradit}
      POSTGRES_USER: ${POSTGRES_USER:-papradit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: papradit-app:local
    build:
      context: .
      target: development
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
