name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: papradit
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: papradit_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U papradit -d papradit_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: isolated-ci-key-not-used-in-any-deployment
      DJANGO_DEBUG: '1'
      POSTGRES_USER: papradit
      POSTGRES_PASSWORD: isolated-ci-only
      POSTGRES_DB: papradit_ci
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
          cache: pip
          cache-dependency-path: '*requirements*.lock'
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: python -m unittest infra.test_release_gate -v
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test work.browser_journeys --noinput
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - run: DJANGO_DEBUG=0 DJANGO_ALLOWED_HOSTS=app.example.test DJANGO_CSRF_TRUSTED_ORIGINS=https://app.example.test python manage.py check --deploy --fail-level WARNING
      - run: sha256sum -c static/vendor/SHA256SUMS
      - run: docker build --target production -t papradit:ci .
      - name: Verify the production image against PostgreSQL
        run: >-
          docker run --rm --network host
          -e DJANGO_SECRET_KEY -e DJANGO_DEBUG
          -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB -e POSTGRES_HOST
          papradit:ci python manage.py test --noinput
      - name: Verify installer removal in production
        run: >-
          docker run --rm papradit:ci python -c
          "import importlib.util; assert importlib.util.find_spec('pip') is None;
          assert importlib.util.find_spec('ensurepip') is None"
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: papradit:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .test-artifacts/
